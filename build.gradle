plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.7.0'
    id 'jacoco'
}

group = 'com.burty'
version = '0.0.1-SNAPSHOT'
description = 'BURTY'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Spring Boot BOM 이 고정하는 버전을 취약점 수정본으로 올린다.
// netty 4.2.15.Final 에 HIGH 4건(CVE-2026-55831/56816/56819/59901)이 있다.
// Boot 가 다음 패치에서 올려주기 전까지 여기서 명시적으로 앞당긴다.
ext['netty.version'] = '4.2.16.Final'

dependencies {
    implementation 'org.springframework:spring-aspects'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-micrometer:2.2.0'
    // Spring Boot 4 는 자동설정을 기술별 모듈로 분리했다.
    // flyway-core 만 넣으면 FlywayAutoConfiguration 이 클래스패스에 없어 마이그레이션이
    // 조용히 실행되지 않는다 (spring.flyway.* 설정이 전부 무시된다).
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.7.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.7.0'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'com.github.librepdf:openpdf:3.0.5'
    implementation 'com.webauthn4j:webauthn4j-core:0.31.7.RELEASE'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mariadb'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    // schema-dump 는 베이스라인 재생성 전용 유틸리티다. 일반 테스트 실행에서는 제외한다.
    // 재생성: ./gradlew schemaDump && python3 tools/generate_baseline.py
    useJUnitPlatform {
        excludeTags 'schema-dump'
    }
    // CI 로그만으로 원인을 파악할 수 있게 실패 시 전체 스택트레이스를 남긴다.
    // 스키마 검증 실패는 원인 메시지가 예외 체인 깊숙이 있어 기본 출력으로는 보이지 않는다.
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces = true
        showCauses = true
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('schemaDump', Test) {
    description = 'JPA 엔티티에서 MariaDB DDL 을 생성한다 (build/generated-schema.sql).'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'schema-dump'
    }
    // 컨텍스트는 MariaDBDialect 로 뜨다가 실패하지만, 그 전에 스키마 파일은 기록된다.
    ignoreFailures = true
}

// 테스트는 Testcontainers MariaDB + Flyway 로 실행된다 (Docker 필요).
// 운영과 동일한 DB 엔진/스키마 위에서 ddl-auto=validate 를 돌려 엔티티↔마이그레이션 드리프트를 잡는다.
jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// 커버리지 게이트 — 돈/보안 관련 패키지는 별도로 더 높은 기준을 적용한다.
tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.33
            }
        }
        rule {
            element = 'CLASS'
            includes = [
                'com.burty.application.service.finance.TransferService',
                'com.burty.application.service.finance.TransferLimitGuard',
                'com.burty.util.FieldEncryptor',
            ]
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.70
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Spring Boot 3.x+ 는 bootJar 외에 plain jar 까지 생성하여 build/libs/ 안에 jar 가 2개 생김.
// Dockerfile 의 COPY *.jar 패턴이 단일 destination 으로 실패하는 문제 회피용으로 plain jar 비활성화.
tasks.named('jar') {
    enabled = false
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
