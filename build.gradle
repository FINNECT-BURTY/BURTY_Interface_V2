plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.0'
    id 'jacoco'
}

group = 'com.burty'
version = '0.0.1-SNAPSHOT'
description = 'BURTY'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Spring Boot BOM 이 고정하는 버전을 취약점 수정본으로 올린다.
// netty 4.2.15.Final 에 HIGH 4건(CVE-2026-55831/56816/56819/59901)이 있다.
// Boot 가 다음 패치에서 올려주기 전까지 여기서 명시적으로 앞당긴다.
ext['netty.version'] = '4.2.16.Final'

dependencies {
    implementation 'org.springframework:spring-aspects'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    // Spring Boot 스타터(resilience4j-spring-boot3)를 쓰지 않는다.
    // 2.4.0 부터 SpringBoot3Verifier 가 Spring Boot 4 를 거부해 버전을 올릴 수 없고,
    // Boot 4 대응 모듈은 배포되지 않았다. 실제로 필요한 건 CircuitBreakerRegistry 뿐이라
    // core 모듈만 쓰고 설정 바인딩은 CircuitBreakerConfiguration 에서 직접 한다.
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.3.0'
    implementation 'io.github.resilience4j:resilience4j-micrometer:2.3.0'
    // Spring Boot 4 는 자동설정을 기술별 모듈로 분리했다.
    // flyway-core 만 넣으면 FlywayAutoConfiguration 이 클래스패스에 없어 마이그레이션이
    // 조용히 실행되지 않는다 (spring.flyway.* 설정이 전부 무시된다).
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.9.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.9.0'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'com.github.librepdf:openpdf:3.0.5'
    implementation 'com.webauthn4j:webauthn4j-core:0.31.9.RELEASE'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mariadb'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    // WebAuthn 검증 경로를 실제 인증기 에뮬레이터로 검증한다.
    // 서명 검증 코드는 페이로드를 실제로 만들어보지 않으면 테스트할 수 없다.
    testImplementation 'com.webauthn4j:webauthn4j-test:0.31.9.RELEASE'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// 빠른 되먹임용. 스프링 컨텍스트를 띄우지 않는 테스트만 돈다.
//
// 예전에는 전체 check 가 18분까지 늘어났다. 그 정도가 되면 사람들이 로컬에서 안 돌리고
// CI 에 떠넘기게 되는데, 그러면 되먹임이 6분에서 20분으로 늘어난다.
tasks.named('test') {
    // schema-dump 는 베이스라인 재생성 전용 유틸리티다. 일반 테스트 실행에서는 제외한다.
    // 재생성: ./gradlew schemaDump && python3 tools/generate_baseline.py
    useJUnitPlatform {
        excludeTags 'schema-dump', 'ci-schema', 'integration'
    }
    // CI 로그만으로 원인을 파악할 수 있게 실패 시 전체 스택트레이스를 남긴다.
    // 스키마 검증 실패는 원인 메시지가 예외 체인 깊숙이 있어 기본 출력으로는 보이지 않는다.
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
        showStackTraces = true
        showCauses = true
    }
}

/**
 * 스프링 컨텍스트·Testcontainers 가 필요한 테스트.
 *
 * <p>느리지만 이쪽이 진짜를 잡는다 — 이번에 나온 결함 대부분이 여기서 드러났다. 분리하는 것은 안 돌리기 위해서가
 * 아니라, 빠른 쪽을 자주 돌리게 하기 위해서다. check 는 여전히 둘 다 실행한다.
 */
tasks.register('integrationTest', Test) {
    description = '스프링 컨텍스트가 필요한 통합 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
        showStackTraces = true
        showCauses = true
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

// CI 백업·복구 검증 전용. 애플리케이션의 Flyway 설정과 validate 를 그대로 쓴다.
// 대상 DB 는 -Dburty.ci.db.* 로 넘긴다.
tasks.register('ciSchema', Test) {
    description = '지정한 DB 에 Flyway 마이그레이션을 적용하고 스키마를 검증한다 (CI 전용).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'ci-schema'
    }
    ['burty.ci.db.url', 'burty.ci.db.user', 'burty.ci.db.password', 'burty.ci.flyway'].each { k ->
        if (System.getProperty(k) != null) {
            systemProperty k, System.getProperty(k)
        }
    }
    outputs.upToDateWhen { false }
}

tasks.register('schemaDump', Test) {
    description = 'JPA 엔티티에서 MariaDB DDL 을 생성한다 (build/generated-schema.sql).'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'schema-dump'
    }
    // 컨텍스트는 MariaDBDialect 로 뜨다가 실패하지만, 그 전에 스키마 파일은 기록된다.
    ignoreFailures = true
}

// 테스트는 Testcontainers MariaDB + Flyway 로 실행된다 (Docker 필요).
// 운영과 동일한 DB 엔진/스키마 위에서 ddl-auto=validate 를 돌려 엔티티↔마이그레이션 드리프트를 잡는다.
jacoco {
    toolVersion = '0.8.12'
}

// 커버리지는 두 태스크를 합산한다. test 만 보면 통합 테스트가 검증한 부분이 통째로
// 미커버로 잡혀, 테스트를 나눈 것만으로 수치가 떨어진다.
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    executionData fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec')
}

// 커버리지 게이트 — 돈/보안 관련 패키지는 별도로 더 높은 기준을 적용한다.
tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.33
            }
        }
        rule {
            element = 'CLASS'
            // 돈·인증 경로. 결함이 나면 되돌리기 어려운 곳들이다.
            //
            // 여기에는 Docker 유무와 무관하게 항상 도는 테스트가 있는 클래스만 넣는다.
            // AsyncJobConsumer 의 Redis 경로는 Testcontainers 가 있어야 돌기 때문에
            // 게이트에 넣으면 로컬에서는 5%, CI 에서는 통과하는 식으로 환경마다 답이 달라진다.
            // 게이트가 환경을 타면 게이트가 아니다. 그쪽은 번들 기준과 계약 테스트로 지킨다.
            includes = [
                'com.burty.application.service.finance.TransferService',
                'com.burty.application.service.finance.TransferLimitGuard',
                'com.burty.application.service.outbox.OutboxRelay',
                'com.burty.security.WebAuthn4jCompositeAssertionVerifier',
                'com.burty.util.FieldEncryptor',
            ]
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.70
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Spring Boot 3.x+ 는 bootJar 외에 plain jar 까지 생성하여 build/libs/ 안에 jar 가 2개 생김.
// Dockerfile 의 COPY *.jar 패턴이 단일 destination 으로 실패하는 문제 회피용으로 plain jar 비활성화.
tasks.named('jar') {
    enabled = false
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
