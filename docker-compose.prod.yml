# prod override — docker-compose.yml 와 함께 사용
#
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 차이점:
#   - 앱 컨테이너의 8080 포트를 호스트에 직접 노출 (Swagger 등 디버그 용)
#   - 공개 도메인 라우팅은 infra/global-nginx 에서 처리
#     · https://burty.co.kr/         → frontend
#     · https://burty.co.kr/api/v1/  → burty:8080
#   - 그 외 환경변수는 .env 로 주입 (COOKIE_DOMAIN, FRONTEND_URL 등)
#
# EC2 Security Group 에서 8080 TCP 인바운드도 열려 있어야 함.

services:
  burty:
    ports:
      - "8080:8080"
