# prod override — docker-compose.yml 와 함께 사용
#
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 차이점:
#   - nginx-proxy (port 80) 와 8080 직접 노출 둘 다 허용
#     · http://44.194.3.230/         → nginx-proxy → burty:8080
#     · http://44.194.3.230:8080/... → 호스트 8080 직접 (Swagger 등 디버그 용)
#   - 그 외 환경변수는 .env 로 주입 (VIRTUAL_HOST, COOKIE_DOMAIN, FRONTEND_URL 등)
#
# EC2 Security Group 에서 8080 TCP 인바운드도 열려 있어야 함.

services:
  burty:
    ports:
      - "8080:8080"