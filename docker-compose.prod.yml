# prod override — docker-compose.yml 와 함께 사용
#
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 차이점:
#   - HOST_LOG_DIR / HOST_UPLOAD_DIR 바인드 경로 지정
#   - prod 필수 secret 은 Jenkins BURTY_ENV_FILE (.env) 로 주입
#   - 8080 포트는 nginx 경유만 허용 (직접 노출하지 않음)

services:
  burty:
    ports: []
