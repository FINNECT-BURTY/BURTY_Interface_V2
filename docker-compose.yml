version: '3.8'

services:
  storyg:
    build:
      context: .
      dockerfile: Dockerfile
    image: berty:latest
    container_name: berty_interface

    ports:
      - "80:8080"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}

      # Database (호스트 MariaDB)
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-berty}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

      # Redis
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-10800000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}

      # CORS
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Frontend URL
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}

      # Mail (Optional)
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}

      # Gemini / Vertex AI
      - GEMINI_ENABLED=${GEMINI_ENABLED:-false}
      - GEMINI_PROJECT_ID=${GEMINI_PROJECT_ID:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/keys.json

      # Upload Path (Docker volume 마운트 경로와 일치시켜야 파일이 유지됨)
      - UPLOAD_PATH=/app/uploads/

      # Log Path (Docker volume 마운트 경로와 일치시켜야 함)
      - LOG_PATH=/app/logs

      # JVM Options
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseContainerSupport -Duser.timezone=Asia/Seoul -Dio.grpc.netty.shaded.io.netty.handler.ssl.noOpenSsl=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/ubuntu/jenkins_home/ws/berty/logs:/app/logs
      - /home/ubuntu/jenkins_home/ws/berty/uploads:/app/uploads
      - /home/ubuntu/jenkins_home/ws/berty/secrets/keys.json:/app/secrets/keys.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - berty-network

networks:
  berty-network:
    driver: bridge
