services:
  burty:
    build:
      context: .
      dockerfile: Dockerfile
    image: burty:latest
    container_name: burty
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      SPRING_JPA_DDLAUTO: ${SPRING_JPA_DDLAUTO:-update}

      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-burty}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      VIRTUAL_HOST: www.burty.co.kr,burty.co.kr
      VIRTUAL_PATH: /api/v1/
      VIRTUAL_PORT: "8080"

      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BURTY_REDIS_ENABLED: ${BURTY_REDIS_ENABLED:-false}

      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-key-minimum-256-bits}
      BURTY_SIGN_SECRET: ${BURTY_SIGN_SECRET:-change-me-burty-sign-secret}
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-burty-admin-setup-key}
      BURTY_YOUTH_CENTER_API_KEY: ${BURTY_YOUTH_CENTER_API_KEY:-}

      APP_BASE_URL: ${APP_BASE_URL:-https://burty.co.kr}

      BURTY_SOCIAL_STUB_MODE: ${BURTY_SOCIAL_STUB_MODE:-true}
      BURTY_SOCIAL_KAKAO_CLIENT_ID: ${BURTY_SOCIAL_KAKAO_CLIENT_ID:-}
      BURTY_SOCIAL_KAKAO_CLIENT_SECRET: ${BURTY_SOCIAL_KAKAO_CLIENT_SECRET:-}
      BURTY_SOCIAL_GOOGLE_CLIENT_ID: ${BURTY_SOCIAL_GOOGLE_CLIENT_ID:-}
      BURTY_SOCIAL_GOOGLE_CLIENT_SECRET: ${BURTY_SOCIAL_GOOGLE_CLIENT_SECRET:-}
      BURTY_SOCIAL_NAVER_CLIENT_ID: ${BURTY_SOCIAL_NAVER_CLIENT_ID:-}
      BURTY_SOCIAL_NAVER_CLIENT_SECRET: ${BURTY_SOCIAL_NAVER_CLIENT_SECRET:-}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      UPLOAD_PATH: /app/uploads/
      LOG_PATH: /app/logs
      LOG_FILE: /app/logs/application.log
      JAVA_OPTS: >-
        -Xms512m -Xmx1024m -XX:+UseContainerSupport
        -Duser.timezone=Asia/Seoul
        -Dio.grpc.netty.shaded.io.netty.handler.ssl.noOpenSsl=true
    volumes:
      - ${HOST_LOG_DIR:-./logs}:/app/logs
      - ${HOST_UPLOAD_DIR:-./uploads}:/app/uploads
    networks:
      - global-nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  global-nginx:
    external: true
    name: global-nginx
