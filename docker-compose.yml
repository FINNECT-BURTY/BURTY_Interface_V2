services:
  burty:
    build:
      context: .
      dockerfile: Dockerfile
    image: burty:latest
    container_name: burty
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # 첫 배포: update (Hibernate 가 스키마 생성). 운영 안정화 후 validate 로 전환.
      SPRING_JPA_DDLAUTO: ${SPRING_JPA_DDLAUTO:-update}

      # MariaDB (호스트 또는 컨테이너)
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-burty_dev}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      # Current production ingress is nginx-proxy.
      # Keep API traffic pinned to the backend path so frontend owns /.
      # If infra/global-nginx is used later, these envs are ignored.
      VIRTUAL_HOST: www.burty.co.kr,burty.co.kr
      VIRTUAL_PATH: /api/v1/
      VIRTUAL_PORT: "8080"

      # Redis
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      burty.redis.enabled: ${BURTY_REDIS_ENABLED:-false}

      # JWT / Burty 설정
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-key-minimum-256-bits}
      burty.jwt.secret: ${JWT_SECRET:-change-me-jwt-secret-key-minimum-256-bits}

      # 소셜 로그인 redirect_uri 가 OAuth provider 콘솔 등록값과 정확히 일치해야 함.
      # application-{prod,dev}.properties 의 ${app.base-url}/api/v1/auth/social/{p}/callback 패턴 사용.
      APP_BASE_URL: ${APP_BASE_URL:-https://burty.co.kr}

      # 소셜 로그인 (실키는 .env / Jenkins BURTY_ENV_FILE 에 보관)
      # stub-mode=false 로 두면 실제 OAuth provider 와 통신.
      BURTY_SOCIAL_STUB_MODE: ${BURTY_SOCIAL_STUB_MODE:-true}
      BURTY_SOCIAL_KAKAO_CLIENT_ID: ${BURTY_SOCIAL_KAKAO_CLIENT_ID:-}
      BURTY_SOCIAL_KAKAO_CLIENT_SECRET: ${BURTY_SOCIAL_KAKAO_CLIENT_SECRET:-}
      BURTY_SOCIAL_GOOGLE_CLIENT_ID: ${BURTY_SOCIAL_GOOGLE_CLIENT_ID:-}
      BURTY_SOCIAL_GOOGLE_CLIENT_SECRET: ${BURTY_SOCIAL_GOOGLE_CLIENT_SECRET:-}
      BURTY_SOCIAL_NAVER_CLIENT_ID: ${BURTY_SOCIAL_NAVER_CLIENT_ID:-}
      BURTY_SOCIAL_NAVER_CLIENT_SECRET: ${BURTY_SOCIAL_NAVER_CLIENT_SECRET:-}

      # CORS / 쿠키
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # Mail (optional)
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      # Gemini / Vertex AI (optional)
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_PROJECT_ID: ${GEMINI_PROJECT_ID:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/keys.json

      UPLOAD_PATH: /app/uploads/
      LOG_PATH: /app/logs
      JAVA_OPTS: >-
        -Xms512m -Xmx1024m -XX:+UseContainerSupport
        -Duser.timezone=Asia/Seoul
        -Dio.grpc.netty.shaded.io.netty.handler.ssl.noOpenSsl=true
    volumes:
      - burty-logs:/app/logs
      - burty-uploads:/app/uploads
      # GCP 키: docker-compose.override.yml 에서 keys.json 마운트 (예시는 .env.example 참고)
    networks:
      - global-nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  # infra/global-nginx 스택이 만든 네트워크 재사용 (먼저 그쪽이 떠 있어야 함)
  global-nginx:
    external: true
    name: global-nginx

volumes:
  burty-logs:
  burty-uploads:
