name: CI

on:
  pull_request:
    branches: [main, develop, release]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Spotless + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      # Docker 가 있는 러너이므로 Testcontainers MariaDB 로 실행된다.
      # → Flyway 마이그레이션 + ddl-auto=validate 로 엔티티↔스키마 드리프트를 게이트한다.
      - name: Run tests (Testcontainers MariaDB + Flyway)
        run: ./gradlew test --no-daemon

      - name: Verify schema migrations ran against a real MariaDB
        run: |
          grep -q 'SchemaMigrationDriftTests' build/test-results/test/*.xml \
            || { echo "::error::스키마 드리프트 테스트가 실행되지 않았습니다 (Docker 미검출)"; exit 1; }

      - name: Coverage gate
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Docker build (validation only)
        run: docker build -t burty:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: burty:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
