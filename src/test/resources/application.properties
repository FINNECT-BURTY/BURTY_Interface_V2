# 통합 테스트.
# 데이터소스와 스키마 전략은 MariaDbTestContainer 가 @DynamicPropertySource 로 주입한다.
#   - Docker 있음 : MariaDB 컨테이너 + Flyway + ddl-auto=validate (엔티티↔마이그레이션 드리프트 검증)
#   - Docker 없음 : H2(MariaDB 모드) + create-drop 으로 강등
# 아래 값들은 위 주입이 없는 경우를 위한 안전한 기본값이다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# 영속성 계약 — application.properties 의 공통 기본값 와 반드시 동일해야 한다.
# 테스트는 spring.config.import 를 타지 않아 application-common 을 로드하지 않는다.
# 이 값이 빠지면 Hibernate 가 네이티브 ENUM 컬럼을 기대하는데 마이그레이션은 VARCHAR 로
# 만들기 때문에 ddl-auto=validate 가 실패한다.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Spring Boot 4 에서 클래스 위치가 바뀌었다.
#   (구) org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
#   (신) org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
# 옛 이름은 클래스가 없어 조용히 무시된다 — 제외가 걸린 줄 알았지만 Redis 자동설정이
# 계속 살아 있었고, 요청마다 localhost:6379 접속을 시도하다 실패하고 있었다.
# AutoConfigurationExclusionTests 가 이름이 유효한지 검증한다.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
burty.redis.enabled=false
burty.api.swagger-enabled=true
burty.api.rate-limit.enabled=false

# 통합/E2E 테스트에서 POST /api/v1/auth/token 사용
burty.auth.test-token-enabled=true
burty.queue.enabled=false
burty.notify.async-enabled=false
management.tracing.enabled=false
burty.mydata.stub-mode=true
burty.external.stub-mode=true

# 서킷브레이커 — application.properties 의 공통 기본값 와 동일하게 유지할 것.
# 테스트는 spring.config.import 를 타지 않아 application-common 을 로드하지 않는다.
# 이 값이 없으면 인스턴스가 등록되지 않아 메트릭도 노출되지 않는다.
resilience4j.circuitbreaker.instances.openbanking.sliding-window-size=10
resilience4j.circuitbreaker.instances.openbanking.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openbanking.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.mydata.sliding-window-size=10
resilience4j.circuitbreaker.instances.mydata.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mydata.wait-duration-in-open-state=30s

# 아웃박스 릴레이 폴링을 사실상 끈다.
# @EnableScheduling 은 테스트에서도 살아 있어 릴레이가 매 초 돈다. 그대로 두면
# 백그라운드 릴레이가 테스트가 발행한 이벤트를 먼저 집어 전달 횟수 검증이 흔들린다.
# 테스트는 relayOnce()/relay() 를 명시적으로 호출해 검증한다.
burty.outbox.poll-interval-ms=3600000

# 실제 인증기 없이 이체 흐름을 돌리기 위한 스텁 (prod 기동은 차단된다).
burty.webauthn.stub-mode=true
