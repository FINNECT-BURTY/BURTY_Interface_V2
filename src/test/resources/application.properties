# 통합 테스트.
# 데이터소스와 스키마 전략은 MariaDbTestContainer 가 @DynamicPropertySource 로 주입한다.
#   - Docker 있음 : MariaDB 컨테이너 + Flyway + ddl-auto=validate (엔티티↔마이그레이션 드리프트 검증)
#   - Docker 없음 : H2(MariaDB 모드) + create-drop 으로 강등
# 아래 값들은 위 주입이 없는 경우를 위한 안전한 기본값이다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
burty.redis.enabled=false
burty.api.swagger-enabled=true
burty.api.rate-limit.enabled=false

# 통합/E2E 테스트에서 POST /api/v1/auth/token 사용
burty.auth.test-token-enabled=true
burty.queue.enabled=false
burty.notify.async-enabled=false
management.tracing.enabled=false
burty.mydata.stub-mode=true
burty.external.stub-mode=true
