spring.config.import=classpath:application-common.properties

# ── 개발 환경 ────────────────────────────────────────────────────────────────
app.base-url=http://localhost:8080

# MariaDB (로컬)
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:burty}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDLAUTO:validate}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.flyway.enabled=true

# POST /api/v1/auth/token (prod 프로파일에서는 코드상 항상 차단)
burty.auth.test-token-enabled=true

burty.mydata.redirect-uri=${app.base-url}/api/v1/mydata/oauth/callback

burty.webauthn.rp-id=localhost
burty.webauthn.origin=${app.base-url}

burty.social.kakao.redirect-uri=${app.base-url}/api/v1/auth/kakao/callback
burty.social.google.redirect-uri=${app.base-url}/api/v1/auth/google/callback
burty.social.naver.redirect-uri=${app.base-url}/api/v1/auth/naver/callback
burty.social.apple.redirect-uri=${app.base-url}/api/v1/auth/apple/callback

# dev 프론트 cross-origin 호출 허용 (Vite 5173 / Next 3000 둘 다 포함)
burty.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

# 로컬 개발: Redis 없이 in-memory fallback
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
burty.redis.enabled=false

# 실제 인증기 없이 이체 흐름을 돌리기 위한 스텁. 서명을 검증하지 않으므로 prod 기동은 차단된다.
burty.webauthn.stub-mode=true
