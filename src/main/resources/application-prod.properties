spring.config.import=classpath:application-common.properties

# ── 운영 환경 (EC2 / Jenkins) ────────────────────────────────────────────────
app.base-url=${APP_BASE_URL:https://burty.co.kr}

# nginx-proxy 의 X-Forwarded-Proto/Host 를 Spring 이 신뢰해 https 스킴 보존.
# (없으면 Springdoc 이 컨테이너 내부에서 본 http 를 OpenAPI servers 에 박아 Swagger 가 mixed-content 차단됨)
server.forward-headers-strategy=framework

# MariaDB (호스트 MariaDB — Docker: DB_HOST=host.docker.internal)
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:host.docker.internal}:${DB_PORT:3306}/${DB_NAME:burty}}

# 초기 배포: DB 가 비어있는 상태에서 Hibernate 가 schema 를 자동 생성하도록 update 사용.
# 운영 안정화 후에는 validate 로 되돌릴 것 (default 만 바꾸고 SPRING_JPA_DDLAUTO 환경변수로 강제도 가능).
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDLAUTO:update}
spring.jpa.properties.hibernate.format_sql=false

burty.auth.test-token-enabled=false

burty.mydata.redirect-uri=${app.base-url}/api/v1/mydata/oauth/callback

burty.webauthn.rp-id=${WEBAUTHN_RP_ID:burty.co.kr}
burty.webauthn.origin=${app.base-url}

burty.social.kakao.redirect-uri=${app.base-url}/api/v1/auth/social/kakao/callback
burty.social.google.redirect-uri=${app.base-url}/api/v1/auth/social/google/callback
burty.social.naver.redirect-uri=${app.base-url}/api/v1/auth/social/naver/callback
burty.social.apple.redirect-uri=${app.base-url}/api/v1/auth/social/apple/callback

# CORS — dev FE 가 운영 BE 를 호출해 카카오 로그인 테스트할 수 있게 localhost 도 임시 허용.
# 운영 도메인 BFF same-origin 호출은 CORS 무관. 필요 시 CORS_ALLOWED_ORIGINS 환경변수로 좁힐 것.
burty.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://burty.co.kr,http://localhost:3000,http://localhost:5173}
