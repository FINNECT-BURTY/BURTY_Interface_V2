
# ── 운영 환경 (EC2 / Jenkins) ────────────────────────────────────────────────
app.base-url=${APP_BASE_URL:https://burty.co.kr}

# nginx-proxy 의 X-Forwarded-Proto/Host 를 Spring 이 신뢰해 https 스킴 보존.
# (없으면 Springdoc 이 컨테이너 내부에서 본 http 를 OpenAPI servers 에 박아 Swagger 가 mixed-content 차단됨)
server.forward-headers-strategy=framework

# 전달 헤더를 신뢰할 프록시 대역. 반드시 실제 nginx/LB 주소로 좁힐 것.
# 비워두면 헤더를 무시하고 프록시 IP 를 클라이언트로 기록하게 되어,
# 레이트리밋이 전체 트래픽을 한 버킷에 몰아넣고 접근 기록도 무의미해진다.
burty.security.trusted-proxies=${TRUSTED_PROXIES:}

# MariaDB (호스트 MariaDB — Docker: DB_HOST=host.docker.internal)
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:host.docker.internal}:${DB_PORT:3306}/${DB_NAME:burty}}

# 초기 배포 이후 스키마는 Flyway + validate 로 관리
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDLAUTO:validate}
spring.jpa.properties.hibernate.format_sql=false

burty.auth.test-token-enabled=false

burty.mydata.stub-mode=false
burty.social.stub-mode=false
burty.external.stub-mode=false
burty.identity.stub-mode=false
burty.notify.email.stub-mode=false
burty.notify.sms.stub-mode=false
burty.notify.push.stub-mode=false
burty.ai.openai.stub-mode=false
burty.voice.stub-mode=false

burty.api.swagger-enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
burty.redis.enabled=true

burty.mydata.redirect-uri=${app.base-url}/api/v1/mydata/oauth/callback

burty.webauthn.rp-id=${WEBAUTHN_RP_ID:burty.co.kr}
# 프론트엔드 origin. 지금은 FE 와 BE 가 같은 도메인이라 app.base-url 과 값이 같지만,
# 의미가 다르므로 묶어두지 않는다. FE 를 별도 호스트로 옮기면 이 값만 바꾸면 된다.
burty.webauthn.origin=${WEBAUTHN_ORIGIN:https://burty.co.kr}

burty.social.kakao.redirect-uri=${app.base-url}/api/v1/auth/kakao/callback
burty.social.google.redirect-uri=${app.base-url}/api/v1/auth/google/callback
burty.social.naver.redirect-uri=${app.base-url}/api/v1/auth/naver/callback
burty.social.apple.redirect-uri=${app.base-url}/api/v1/auth/apple/callback

management.endpoint.health.show-details=never
# Prometheus 는 Docker 내부 네트워크에서만 scrape — nginx 가 외부 /actuator 차단
burty.security.actuator.prometheus-permit-all=true

management.tracing.enabled=true
management.tracing.sampling.probability=0.2

# CORS — 운영 기본값에 localhost 를 두지 않는다.
# 예전 기본값에는 localhost:3000/5173 이 포함돼 있었다. 개발자 로컬에서 운영 API 를 직접
# 호출해 테스트하려던 편의였지만, 그건 곧 임의의 로컬 페이지가 사용자 쿠키로 운영 API 를
# 호출할 수 있다는 뜻이다 (allow-credentials 가 켜져 있으므로).
# 임시로 필요하면 배포 시 CORS_ALLOWED_ORIGINS 로 명시적으로 넓힌다.
burty.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://burty.co.kr}
