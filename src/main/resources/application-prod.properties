spring.config.import=classpath:application-common.properties

# ── 운영 환경 (EC2 / Jenkins) ────────────────────────────────────────────────
app.base-url=${APP_BASE_URL:http://44.194.3.230}

# MariaDB (호스트 MariaDB — Docker: DB_HOST=host.docker.internal)
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:host.docker.internal}:${DB_PORT:3306}/${DB_NAME:burty}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDLAUTO:validate}
spring.jpa.properties.hibernate.format_sql=false

burty.auth.test-token-enabled=false

burty.mydata.redirect-uri=${app.base-url}/api/burty/mydata/oauth/callback

burty.webauthn.rp-id=${WEBAUTHN_RP_ID:44.194.3.230}
burty.webauthn.origin=${app.base-url}

burty.social.kakao.redirect-uri=${app.base-url}/api/burty/auth/social/kakao/callback
burty.social.google.redirect-uri=${app.base-url}/api/burty/auth/social/google/callback
burty.social.naver.redirect-uri=${app.base-url}/api/burty/auth/social/naver/callback
burty.social.apple.redirect-uri=${app.base-url}/api/burty/auth/social/apple/callback
