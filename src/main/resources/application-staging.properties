
# ── 스테이징 ────────────────────────────────────────────────────────────────
#
# 운영과 같은 코드 경로를 타되 실제 금융기관 자격증명은 쓰지 않는다.
# 외부 연동은 stub 이 아니라 WireMock 을 향한다 — 차이가 중요하다.
#
#   stub-mode=true  : 어댑터가 HTTP 를 아예 타지 않고 가짜 객체를 돌려준다.
#                     직렬화·타임아웃·에러 매핑·서킷브레이커가 전부 검증되지 않는다.
#   WireMock        : 실제 HTTP 요청이 나가고 실제 응답이 들어온다.
#                     운영에서 문제가 되는 것은 대부분 이 경로다.
#
# 즉 스테이징의 목적은 "기능이 되나" 가 아니라 "연동 경로가 실제로 도나" 다.

app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:burty}}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# 운영과 동일하게 Redis 를 쓴다. in-memory fallback 으로 도는 경로는 운영에 없다.
burty.redis.enabled=true
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# 인그레스 없이 직접 접속하므로 전달 헤더를 신뢰하지 않는다.
burty.security.trusted-proxies=${TRUSTED_PROXIES:}

# ── 외부 연동을 WireMock 으로 ────────────────────────────────────────────────
burty.external.stub-mode=false
burty.mydata.stub-mode=false
burty.identity.stub-mode=false

burty.external.open-banking-accounts-url=${MOCK_BANK_URL:http://wiremock:8080}/openbanking/v2.0/account/list
burty.external.open-banking-balance-url=${MOCK_BANK_URL:http://wiremock:8080}/openbanking/v2.0/account/balance
burty.external.open-banking-transactions-url=${MOCK_BANK_URL:http://wiremock:8080}/openbanking/v2.0/account/transaction_list
burty.external.open-banking-transfer-url=${MOCK_BANK_URL:http://wiremock:8080}/openbanking/v2.0/transfer/withdraw
burty.external.open-banking-transfer-status-url=${MOCK_BANK_URL:http://wiremock:8080}/openbanking/v2.0/transfer/result
burty.external.open-banking-token-url=${MOCK_BANK_URL:http://wiremock:8080}/openbanking/oauth/2.0/token
burty.external.open-banking-access-token=staging-access-token
# 연동(링크) 흐름에도 값이 있어야 토큰 교환 요청 본문이 만들어진다.
burty.external.open-banking-client-id=staging-client-id
burty.external.open-banking-client-secret=staging-client-secret

burty.mydata.token-url=${MOCK_BANK_URL:http://wiremock:8080}/mydata/oauth2/token
burty.mydata.refresh-url=${MOCK_BANK_URL:http://wiremock:8080}/mydata/oauth2/token
burty.mydata.asset-url=${MOCK_BANK_URL:http://wiremock:8080}/mydata/api/v1/assets

# ── 알림은 stub 으로 둔다 ────────────────────────────────────────────────────
# 실제 발송은 사람에게 도달하므로 스테이징에서 켜면 안 된다.
burty.notify.email.stub-mode=true
burty.notify.sms.stub-mode=true
burty.notify.push.stub-mode=true
burty.social.stub-mode=true
burty.ai.openai.stub-mode=true
burty.voice.stub-mode=true

# 부하 시험에서 토큰을 발급받아야 한다. 운영 프로파일에서는 코드상 항상 차단된다.
burty.auth.test-token-enabled=true

# 부하 시험 중에는 레이트리밋을 꺼야 처리량을 잴 수 있다.
burty.api.rate-limit.enabled=${BURTY_API_RATELIMIT_ENABLED:true}

burty.api.swagger-enabled=true
burty.webauthn.stub-mode=true
burty.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
burty.webauthn.origin=${app.base-url}

logging.level.root=INFO
logging.level.com.burty=DEBUG
