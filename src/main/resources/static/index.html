<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BURTY 생활금융 대시보드</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">AI 생활금융 에이전트</p>
        <h1>BURTY</h1>
      </div>
      <button id="refreshBtn" class="icon-button" type="button" title="새로고침" aria-label="새로고침">↻</button>
    </header>

    <section class="risk-band" aria-label="현금흐름 요약">
      <div>
        <p class="section-label">30일 현금흐름</p>
        <h2 id="riskTitle">데이터를 불러오는 중</h2>
        <p id="riskReason" class="muted">데모 세션을 준비하고 있습니다.</p>
      </div>
      <div class="risk-number">
        <span id="riskLevel">-</span>
        <strong id="minBalance">-</strong>
        <small>예상 최저잔액</small>
      </div>
    </section>

    <section class="grid two">
      <div class="panel chart-panel">
        <div class="panel-head">
          <div>
            <p class="section-label">예상 잔액</p>
            <h3>앞으로 30일</h3>
          </div>
          <span id="riskDate" class="badge">위험일 확인 중</span>
        </div>
        <div class="chart-wrap">
          <canvas id="balanceChart" width="720" height="260" aria-label="30일 예상 잔액 그래프"></canvas>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div>
            <p class="section-label">우선 행동</p>
            <h3 id="actionTitle">추천 계산 중</h3>
          </div>
          <button id="acceptActionBtn" class="primary" type="button">수락</button>
        </div>
        <p id="actionDesc" class="body-copy">가장 효과적인 행동 1개를 고르고 있습니다.</p>
        <dl class="metric-list">
          <div>
            <dt>예상 개선효과</dt>
            <dd id="actionImpact">-</dd>
          </div>
          <div>
            <dt>우선순위 점수</dt>
            <dd id="actionScore">-</dd>
          </div>
        </dl>
      </div>
    </section>

    <section class="grid three">
      <div class="panel">
        <p class="section-label">위험 원인</p>
        <ul id="causeList" class="stack-list"></ul>
      </div>
      <div class="panel">
        <p class="section-label">청년 정책 매칭</p>
        <ul id="policyList" class="stack-list"></ul>
      </div>
      <div class="panel">
        <p class="section-label">AI 리포트</p>
        <p id="aiSummary" class="body-copy">리포트를 생성하고 있습니다.</p>
        <div id="aiActions" class="chip-row"></div>
      </div>
    </section>

    <section class="panel calendar-panel">
      <div class="panel-head">
        <div>
          <p class="section-label">터치포인트</p>
          <h3>현금흐름 캘린더</h3>
        </div>
        <span id="scenarioText" class="muted"></span>
      </div>
      <div id="calendar" class="calendar"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
