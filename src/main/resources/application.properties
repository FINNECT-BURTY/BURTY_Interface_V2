spring.application.name=NURI

nuri.mydata.client-id=nuri-client
nuri.mydata.client-secret=nuri-secret
nuri.mydata.authorize-url=https://sandbox.mydata.local/oauth2/authorize
nuri.mydata.token-url=https://sandbox.mydata.local/oauth2/token
nuri.mydata.refresh-url=https://sandbox.mydata.local/oauth2/token
nuri.mydata.asset-url=https://sandbox.mydata.local/api/v1/assets
nuri.mydata.redirect-uri=http://localhost:8080/api/nuri/mydata/oauth/callback
nuri.mydata.scope=asset.read transfer.read
nuri.mydata.stub-mode=true
nuri.mydata.retry-count=2

nuri.webauthn.server-secret=change-me-webauthn-secret
nuri.webauthn.challenge-ttl-seconds=300
nuri.webauthn.rp-id=localhost
nuri.webauthn.origin=http://localhost:8080

nuri.redis.enabled=false

nuri.jwt.secret=change-me-jwt-secret-key-for-nuri
nuri.jwt.expiration-seconds=3600

nuri.report.cron=0 0 9 1 * *
nuri.report.delivery.webhook-enabled=false
nuri.report.delivery.webhook-url=
nuri.report.delivery.attach-pdf-base64=false

nuri.external.stub-mode=true
nuri.external.kakao-transfer-url=https://api.kakaobank.local/openbanking/transfers
nuri.external.kakao-api-key=kakao-api-key
nuri.external.hana-transfer-url=https://api.hanabank.local/openbanking/transfers
nuri.external.hana-api-key=hana-api-key
nuri.external.kb-transfer-url=https://api.kbbank.local/openbanking/transfers
nuri.external.kb-api-key=kb-api-key
nuri.external.shinhan-transfer-url=https://api.shinhanbank.local/openbanking/transfers
nuri.external.shinhan-api-key=shinhan-api-key
nuri.external.im-transfer-url=https://api.imbank.local/openbanking/transfers
nuri.external.im-api-key=im-api-key
nuri.external.pension-summary-url=https://api.pension.local/v1/summary
nuri.external.pension-api-key=pension-api-key
nuri.external.timeout-ms=5000

nuri.voice.stub-mode=true
nuri.voice.tts-url=https://api.voice.local/tts
nuri.voice.stt-url=https://api.voice.local/stt
nuri.voice.api-key=voice-api-key

nuri.ai.openai.stub-mode=true
nuri.ai.openai.api-key=
nuri.ai.openai.base-url=https://api.openai.com/v1
nuri.ai.openai.model=gpt-4o-mini
nuri.ai.openai.timeout-ms=8000
nuri.ai.openai.temperature=0.2
nuri.ai.openai.max-tokens=300

# MariaDB datasource (override with environment variables if needed)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/nuri}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
