spring.application.name=BERTY

berty.mydata.client-id=berty-client
berty.mydata.client-secret=berty-secret
berty.mydata.authorize-url=https://sandbox.mydata.local/oauth2/authorize
berty.mydata.token-url=https://sandbox.mydata.local/oauth2/token
berty.mydata.refresh-url=https://sandbox.mydata.local/oauth2/token
berty.mydata.asset-url=https://sandbox.mydata.local/api/v1/assets
berty.mydata.redirect-uri=http://localhost:8080/api/berty/mydata/oauth/callback
berty.mydata.scope=asset.read transfer.read
berty.mydata.stub-mode=true
berty.mydata.retry-count=2

berty.webauthn.server-secret=change-me-webauthn-secret
berty.webauthn.challenge-ttl-seconds=300
berty.webauthn.rp-id=localhost
berty.webauthn.origin=http://localhost:8080

berty.redis.enabled=false

berty.jwt.secret=change-me-jwt-secret-key-for-berty
berty.jwt.expiration-seconds=3600

# 테스트용 임의 userId JWT (POST /api/berty/auth/token). 운영·prod 프로파일에서는 항상 비활성화.
berty.auth.test-token-enabled=false

berty.onboarding.consent.terms-version=1.0
berty.onboarding.consent.privacy-version=1.0

berty.social.stub-mode=true
berty.social.timeout-ms=5000
berty.social.kakao.client-id=
berty.social.kakao.client-secret=
berty.social.kakao.redirect-uri=http://localhost:8080/api/berty/auth/social/kakao/callback
berty.social.kakao.authorize-url=https://kauth.kakao.com/oauth/authorize
berty.social.kakao.token-url=https://kauth.kakao.com/oauth/token
berty.social.kakao.user-info-url=https://kapi.kakao.com/v2/user/me
berty.social.kakao.scope=profile_nickname account_email
berty.social.google.client-id=
berty.social.google.client-secret=
berty.social.google.redirect-uri=http://localhost:8080/api/berty/auth/social/google/callback
berty.social.google.authorize-url=https://accounts.google.com/o/oauth2/v2/auth
berty.social.google.token-url=https://oauth2.googleapis.com/token
berty.social.google.user-info-url=https://www.googleapis.com/oauth2/v3/userinfo
berty.social.google.scope=openid email profile
berty.social.naver.client-id=
berty.social.naver.client-secret=
berty.social.naver.redirect-uri=http://localhost:8080/api/berty/auth/social/naver/callback
berty.social.naver.authorize-url=https://nid.naver.com/oauth2.0/authorize
berty.social.naver.token-url=https://nid.naver.com/oauth2.0/token
berty.social.naver.user-info-url=https://openapi.naver.com/v1/nid/me
berty.social.naver.scope=
berty.social.apple.client-id=
berty.social.apple.client-secret=
berty.social.apple.redirect-uri=http://localhost:8080/api/berty/auth/social/apple/callback
berty.social.apple.authorize-url=https://appleid.apple.com/auth/authorize
berty.social.apple.token-url=https://appleid.apple.com/auth/token
berty.social.apple.user-info-url=
berty.social.apple.scope=name email

berty.report.cron=0 0 9 1 * *
berty.report.delivery.webhook-enabled=false
berty.report.delivery.webhook-url=
berty.report.delivery.attach-pdf-base64=false

berty.external.stub-mode=true
berty.external.kakao-transfer-url=https://api.kakaobank.local/openbanking/transfers
berty.external.kakao-api-key=kakao-api-key
berty.external.hana-transfer-url=https://api.hanabank.local/openbanking/transfers
berty.external.hana-api-key=hana-api-key
berty.external.kb-transfer-url=https://api.kbbank.local/openbanking/transfers
berty.external.kb-api-key=kb-api-key
berty.external.shinhan-transfer-url=https://api.shinhanbank.local/openbanking/transfers
berty.external.shinhan-api-key=shinhan-api-key
berty.external.im-transfer-url=https://api.imbank.local/openbanking/transfers
berty.external.im-api-key=im-api-key
berty.external.open-banking-accounts-url=https://testapi.openbanking.or.kr/v2.0/account/list
berty.external.open-banking-balance-url=https://testapi.openbanking.or.kr/v2.0/account/balance/fin_num
berty.external.open-banking-transactions-url=https://testapi.openbanking.or.kr/v2.0/account/transaction_list/fin_num
berty.external.open-banking-transfer-url=https://testapi.openbanking.or.kr/v2.0/transfer/withdraw/fin_num
berty.external.open-banking-client-id=
berty.external.open-banking-client-secret=
berty.external.open-banking-access-token=
berty.external.open-banking-refresh-token=
berty.external.open-banking-token-url=https://testapi.openbanking.or.kr/oauth/2.0/token
berty.external.open-banking-retry-count=1
berty.external.pension-summary-url=https://api.pension.local/v1/summary
berty.external.pension-api-key=pension-api-key
berty.external.timeout-ms=5000

berty.voice.stub-mode=true
berty.voice.tts-url=https://api.voice.local/tts
berty.voice.stt-url=https://api.voice.local/stt
berty.voice.api-key=voice-api-key

berty.ai.openai.stub-mode=true
berty.ai.openai.api-key=
berty.ai.openai.base-url=https://api.openai.com/v1
berty.ai.openai.model=gpt-4o-mini
berty.ai.openai.timeout-ms=8000
berty.ai.openai.temperature=0.2
berty.ai.openai.max-tokens=300

# MariaDB datasource (override with environment variables if needed)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/berty}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA — 스키마는 Hibernate ddl-auto만 사용(Flyway 미사용). 기본 update, 운영에서 고정 시 validate 등으로 전환 가능.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDLAUTO:update}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
