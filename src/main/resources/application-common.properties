# dev / prod 공통 (spring.config.import 로 로드)

# 파일 로그 (logback-spring.xml) — Docker: LOG_PATH=/app/logs, LOG_FILE=/app/logs/application.log
logging.config=classpath:logback-spring.xml
logging.file.name=${LOG_PATH:./logs}/application.log

# Actuator / Prometheus
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name:BURTY}
management.prometheus.metrics.export.enabled=true

# ── 서버 / 종료 ──────────────────────────────────────────────────────────────
# 배포 시 진행 중인 요청(특히 이체)을 끊지 않고 마무리한 뒤 종료한다.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── 스케줄링 / 비동기 풀 ─────────────────────────────────────────────────────
# 기본값 1 이면 크론 배치 하나가 큐 폴러를 통째로 막는다.
burty.scheduling.pool-size=8
burty.async.core-pool-size=8
burty.async.max-pool-size=32
burty.async.queue-capacity=500

# ── DB 커넥션 풀 ─────────────────────────────────────────────────────────────
# 외부 API 호출은 트랜잭션 밖으로 뺐지만, 풀 크기와 누수 감지는 명시해 두는 편이 안전하다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# 커넥션을 오래 잡고 있는 코드를 조기에 드러낸다 (경고만, 회수하지는 않음).
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.pool-name=burty-hikari

# API
burty.api.swagger-enabled=true
burty.api.rate-limit.enabled=true

# 로그인 실패 per-user 파일 (LoginFailLogUtil)
burty.login-fail.log-dir=${LOG_PATH:./logs}
burty.login-fail.file-prefix=login_fail_
burty.login-fail.file-suffix=.log
burty.login-fail.max-attempts=5

# HMAC 단기 서명 (SignUtil)
burty.sign.secret=${BURTY_SIGN_SECRET:change-me-burty-sign-secret}
burty.sign.ttl-seconds=10800

# 파일 저장 (FileUtil / FileStorageProperties) — UPLOAD_PATH 와 동기화
file.storage.upload-dir=${UPLOAD_PATH:uploads/}
file.storage.max-file-size=104857600
file.storage.contract-max-file-size=52428800
file.storage.allowed-extensions=.jpg.jpeg.png.gif.webp.pdf.txt.json.xml.doc.docx.xlsx.hwp

# Spring multipart 한도 (FileUtil 검증 전에 거부되지 않도록 file.storage 와 맞춤)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Jenkins 관리 API (기본 비활성 — jenkins.enabled=true 시에만 빈 로드)
jenkins.enabled=false

# 최초 관리자 부트스트랩. 관리자가 한 명이라도 생기면 자동으로 닫히며, prod 에서는 기동이 차단된다.
burty.admin.bootstrap-enabled=${BURTY_ADMIN_BOOTSTRAP:false}

burty.mydata.client-id=burty-client
burty.mydata.client-secret=burty-secret
burty.mydata.authorize-url=https://sandbox.mydata.local/oauth2/authorize
burty.mydata.token-url=https://sandbox.mydata.local/oauth2/token
burty.mydata.refresh-url=https://sandbox.mydata.local/oauth2/token
burty.mydata.asset-url=https://sandbox.mydata.local/api/v1/assets
burty.mydata.scope=asset.read transfer.read
burty.mydata.stub-mode=true
burty.mydata.retry-count=2
burty.mydata.token-refresh-cron=0 */15 * * * *
burty.mydata.token-refresh-ahead-hours=6
# 동의 유효기간 만료 처리 — 예전에는 consent_expires_at 컬럼이 있어도 아무도 읽지 않았다.
burty.mydata.consent-expiry-cron=0 10 * * * *
burty.mydata.consent-warn-ahead-days=7

burty.external.open-banking-authorize-url=https://testapi.openbanking.or.kr/oauth/2.0/authorize
