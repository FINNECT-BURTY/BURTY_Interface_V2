spring.datasource.username=${DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# enum 컬럼을 MariaDB 네이티브 ENUM 이 아니라 VARCHAR 로 매핑한다.
# 네이티브 ENUM 은 enum 상수를 하나 추가할 때마다 ALTER TABLE 이 필요하고, 마이그레이션과
# validate 사이에서 타입 불일치를 만들기 쉽다. 애플리케이션이 값을 검증하므로 VARCHAR 로 충분하다.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

# Flyway — 기존 DB는 baseline-on-migrate 로 추적 시작
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# 필드 암호화 (마이데이터 토큰 등)
burty.security.field-encryption-key=${BURTY_FIELD_ENCRYPTION_KEY:change-me-burty-field-encryption-key-32}

# Swagger / OpenAPI 경로를 /api/v1 prefix 아래로 노출
# UI:   /api/v1/swagger-ui/index.html  (springdoc.swagger-ui.path 가 redirect 진입점)
# Docs: /api/v1/v3/api-docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
springdoc.api-docs.path=/api/v1/v3/api-docs
springdoc.swagger-ui.enabled=${burty.api.swagger-enabled:true}
springdoc.api-docs.enabled=${burty.api.swagger-enabled:true}
