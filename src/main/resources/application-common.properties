# ── 이체 정책 ────────────────────────────────────────────────────────────────
burty.transfer.family-alert-threshold=1000000
burty.transfer.large-transfer-threshold=3000000
burty.transfer.night-start=23:00
burty.transfer.night-end=06:00
# 결과 불명 건의 정산 조회 주기·상한
burty.transfer.reconcile-initial-delay-seconds=30
burty.transfer.reconcile-retry-delay-seconds=300
burty.transfer.reconcile-max-attempts=12
burty.transfer.stuck-executing-seconds=120
burty.transfer.reconcile-interval-ms=30000

# 보호자 사전 승인 — 사후 통지가 아니라 차단이 목적이다.
burty.transfer.approval-enabled=true
burty.transfer.approval-threshold=500000
burty.transfer.approval-expiry-minutes=60
burty.transfer.approval-expiry-interval-ms=60000

# ── 트랜잭셔널 아웃박스 ───────────────────────────────────────────────────────
burty.outbox.enabled=true
burty.outbox.poll-interval-ms=1000
burty.outbox.batch-size=50
burty.outbox.max-attempts=8
burty.outbox.backoff-base-seconds=5
