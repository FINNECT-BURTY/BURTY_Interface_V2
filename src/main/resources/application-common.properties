# dev / prod 공통 (spring.config.import 로 로드)

burty.mydata.client-id=burty-client
burty.mydata.client-secret=burty-secret
burty.mydata.authorize-url=https://sandbox.mydata.local/oauth2/authorize
burty.mydata.token-url=https://sandbox.mydata.local/oauth2/token
burty.mydata.refresh-url=https://sandbox.mydata.local/oauth2/token
burty.mydata.asset-url=https://sandbox.mydata.local/api/v1/assets
burty.mydata.scope=asset.read transfer.read
burty.mydata.stub-mode=true
burty.mydata.retry-count=2

burty.webauthn.server-secret=change-me-webauthn-secret
burty.webauthn.challenge-ttl-seconds=300

burty.redis.enabled=false

burty.jwt.secret=${JWT_SECRET:change-me-jwt-secret-key-for-burty}
burty.jwt.expiration-seconds=3600
burty.jwt.refresh-expiration-seconds=604800

burty.auth.cookie-domain=${COOKIE_DOMAIN:}
burty.auth.cookie-secure=${COOKIE_SECURE:true}
burty.auth.cookie-same-site=${COOKIE_SAMESITE:Lax}
burty.auth.oauth-success-redirect=${OAUTH_SUCCESS_REDIRECT:/auth/callback}

burty.onboarding.consent.terms-version=1.0
burty.onboarding.consent.privacy-version=1.0

burty.social.stub-mode=true
burty.social.timeout-ms=5000
burty.social.kakao.client-id=
burty.social.kakao.client-secret=
burty.social.kakao.authorize-url=https://kauth.kakao.com/oauth/authorize
burty.social.kakao.token-url=https://kauth.kakao.com/oauth/token
burty.social.kakao.user-info-url=https://kapi.kakao.com/v2/user/me
burty.social.kakao.scope=profile_nickname account_email
burty.social.google.client-id=
burty.social.google.client-secret=
burty.social.google.authorize-url=https://accounts.google.com/o/oauth2/v2/auth
burty.social.google.token-url=https://oauth2.googleapis.com/token
burty.social.google.user-info-url=https://www.googleapis.com/oauth2/v3/userinfo
burty.social.google.scope=openid email profile
burty.social.naver.client-id=
burty.social.naver.client-secret=
burty.social.naver.authorize-url=https://nid.naver.com/oauth2.0/authorize
burty.social.naver.token-url=https://nid.naver.com/oauth2.0/token
burty.social.naver.user-info-url=https://openapi.naver.com/v1/nid/me
burty.social.naver.scope=
burty.social.apple.client-id=
burty.social.apple.client-secret=
burty.social.apple.authorize-url=https://appleid.apple.com/auth/authorize
burty.social.apple.token-url=https://appleid.apple.com/auth/token
burty.social.apple.user-info-url=
burty.social.apple.scope=name email

burty.report.cron=0 0 9 1 * *
burty.report.delivery.webhook-enabled=false
burty.report.delivery.webhook-url=
burty.report.delivery.attach-pdf-base64=false

burty.external.stub-mode=true
burty.external.kakao-transfer-url=https://api.kakaobank.local/openbanking/transfers
burty.external.kakao-api-key=kakao-api-key
burty.external.hana-transfer-url=https://api.hanabank.local/openbanking/transfers
burty.external.hana-api-key=hana-api-key
burty.external.kb-transfer-url=https://api.kbbank.local/openbanking/transfers
burty.external.kb-api-key=kb-api-key
burty.external.shinhan-transfer-url=https://api.shinhanbank.local/openbanking/transfers
burty.external.shinhan-api-key=shinhan-api-key
burty.external.im-transfer-url=https://api.imbank.local/openbanking/transfers
burty.external.im-api-key=im-api-key
burty.external.open-banking-accounts-url=https://testapi.openbanking.or.kr/v2.0/account/list
burty.external.open-banking-balance-url=https://testapi.openbanking.or.kr/v2.0/account/balance/fin_num
burty.external.open-banking-transactions-url=https://testapi.openbanking.or.kr/v2.0/account/transaction_list/fin_num
burty.external.open-banking-transfer-url=https://testapi.openbanking.or.kr/v2.0/transfer/withdraw/fin_num
burty.external.open-banking-client-id=
burty.external.open-banking-client-secret=
burty.external.open-banking-access-token=
burty.external.open-banking-refresh-token=
burty.external.open-banking-token-url=https://testapi.openbanking.or.kr/oauth/2.0/token
burty.external.open-banking-retry-count=1
burty.external.pension-summary-url=https://api.pension.local/v1/summary
burty.external.pension-api-key=pension-api-key
burty.external.timeout-ms=5000

burty.voice.stub-mode=true
burty.voice.tts-url=https://api.voice.local/tts
burty.voice.stt-url=https://api.voice.local/stt
burty.voice.api-key=voice-api-key

burty.ai.openai.stub-mode=true
burty.ai.openai.api-key=
burty.ai.openai.base-url=https://api.openai.com/v1
burty.ai.openai.model=gpt-4o-mini
burty.ai.openai.timeout-ms=8000
burty.ai.openai.temperature=0.2
burty.ai.openai.max-tokens=300

spring.datasource.username=${DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# Swagger / OpenAPI 경로를 /api/v1 prefix 아래로 노출
# UI:   /api/v1/swagger-ui/index.html  (springdoc.swagger-ui.path 가 redirect 진입점)
# Docs: /api/v1/v3/api-docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
springdoc.api-docs.path=/api/v1/v3/api-docs
