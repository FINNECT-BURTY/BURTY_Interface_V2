user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 20m;

    # 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # 업스트림 — docker compose 의 서비스 이름이 곧 DNS 호스트명
    # FE 가 아직 안 떠 있어도 nginx 부팅은 OK (resolver 동적 처리). 단 location 매칭 시
    # connect 안 되면 502. FE 띄우면 자동 연결됨.
    upstream burty_backend {
        server burty:8080;
    }
    upstream burty_frontend {
        server frontend:80;
    }

    limit_req_zone $binary_remote_addr zone=burty_auth:10m rate=60r/m;

    # ── HTTP (80) : ACME challenge + HTTPS 리다이렉트 ─────────────────────────
    server {
        listen 80;
        server_name burty.co.kr www.burty.co.kr;

        # Let's Encrypt HTTP-01 challenge 경로 — certbot 이 webroot 로 응답 파일 생성
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # 나머지는 전부 HTTPS 로 redirect
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS (443) : 메인 서비스 ────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name burty.co.kr www.burty.co.kr;

        ssl_certificate     /etc/letsencrypt/live/burty.co.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/burty.co.kr/privkey.pem;

        # TLS 보안 — Mozilla intermediate 권장
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozSSL:10m;
        ssl_session_tickets off;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Actuator 는 Docker 내부 Prometheus 가 직접 scrape — 외부 노출 차단
        location /actuator/ {
            return 404;
        }

        location ~ ^/api/v1/(auth|admin/auth|sessions) {
            limit_req zone=burty_auth burst=20 nodelay;
            proxy_pass http://burty_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # 백엔드 라우팅 — 더 구체적인 path 가 위로 와야 매칭 우선
        location /api/v1/ {
            proxy_pass http://burty_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /swagger-ui/ {
            proxy_pass http://burty_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location = /swagger-ui.html {
            proxy_pass http://burty_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /v3/api-docs {
            proxy_pass http://burty_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /webjars/ {
            proxy_pass http://burty_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location = /health {
            proxy_pass http://burty_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # 프론트엔드 (catch-all) — 정적/SSR 모두 처리
        location / {
            proxy_pass http://burty_frontend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
