# Grafana reverse proxy (optional)
# docker-compose.local.yml 로 grafana 가 global-nginx 네트워크에 있을 때만 nginx.conf 에 include.
#
#   include /etc/nginx/conf.d/grafana.conf;
#
# Grafana env:
#   GF_SERVER_ROOT_URL=https://burty.co.kr/grafana/
#   GF_SERVER_SERVE_FROM_SUB_PATH=true
#   BURTY_GRAFANA_PUBLIC_BASE_URL=https://burty.co.kr/grafana

upstream burty_grafana {
    server grafana:3000;
}

location /grafana/ {
    proxy_pass http://burty_grafana/;
    include /etc/nginx/conf.d/proxy_params.conf;
    proxy_set_header X-Forwarded-Prefix /grafana;
}
