# BURTY 알람 룰
#
# 대시보드는 있는데 알람이 없었다. 사람이 화면을 보고 있을 때만 장애를 발견하는 상태였다.
# 아래 항목들은 "발생하면 사람이 즉시 알아야 하는" 것들이다.

groups:
  - name: burty-money
    interval: 30s
    rules:
      # 결과를 확인하지 못한 이체. 출금됐는지 아닌지 모르는 건이 쌓이면 즉시 사람이 봐야 한다.
      - alert: TransferResultUnknown
        expr: sum(burty_transfer_reconciliation_total{outcome="manual-review"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "이체 결과 미확정 건 발생 — 은행 원장 수동 대조 필요"
          description: "정산 배치가 재시도를 소진했습니다. 실제 출금 여부를 은행 원장과 대조해야 합니다."

      # 정산 대기가 계속 늘어나면 은행 연동 자체에 문제가 있다는 뜻이다.
      - alert: TransferReconciliationBacklog
        expr: rate(burty_transfer_reconciliation_total{outcome="rescheduled"}[10m]) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "이체 정산 재시도가 계속 쌓이는 중"

      - alert: TransferFailureRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{uri=~".*/transfers.*",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{uri=~".*/transfers.*"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "이체 API 5xx 비율 5% 초과"

  - name: burty-integrity
    interval: 60s
    rules:
      # 아웃박스 DEAD = 알림/이벤트가 영구 유실된 상태. 조용히 지나가면 안 된다.
      - alert: OutboxDeadLetter
        expr: sum(burty_outbox_dead_total) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "아웃박스 이벤트가 DEAD 로 격리됨 — 발행 실패 확인 필요"

      - alert: OutboxRetryStorm
        expr: rate(burty_outbox_retried_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "아웃박스 재시도가 급증 — 하위 채널 장애 의심"

      # 감사 기록은 규제 대응 자료다. 저장에 실패하면 업무 흐름은 계속 가지만
      # 기록만 사라진다. 나중에 남는 것은 "그 시점 기록이 없다" 는 사실뿐이다.
      - alert: AuditLogSaveFailed
        expr: sum(increase(burty_audit_save_failed_total[10m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "감사 기록 저장 실패 — 규제 기록이 유실되고 있음"

  - name: burty-platform
    interval: 30s
    rules:
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "서킷브레이커 OPEN — 외부 연동 {{ $labels.name }} 중단"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)
          > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "전체 5xx 비율 2% 초과"

      - alert: DbConnectionPoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "DB 커넥션 풀 대기 발생 — 커넥션을 오래 잡는 코드 확인 필요"

      - alert: ApplicationDown
        expr: up{job="burty"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "BURTY 애플리케이션 응답 없음"

  - name: burty-batch
    interval: 60s
    rules:
      # 마이데이터 토큰 갱신이 멈추면 조용히 연동이 끊긴다. 사용자는 며칠 뒤에야 안다.
      - alert: MyDataTokenRefreshStalled
        expr: |
          time() - max(burty_mydata_token_refresh_last_success_timestamp_seconds) > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "마이데이터 토큰 갱신 배치가 1시간 이상 성공하지 못함"
