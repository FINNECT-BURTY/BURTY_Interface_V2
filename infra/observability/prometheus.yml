global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 알람 룰. 대시보드만 있고 알람이 없으면 사람이 화면을 보고 있을 때만 장애를 발견한다.
rule_files:
  - /etc/prometheus/alert-rules.yml

# 룰을 평가만 하면 Prometheus 화면에 FIRING 으로 뜰 뿐 아무에게도 가지 않는다.
# 통지는 Alertmanager 가 한다.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: burty
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['burty:8080']
